<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #13315c 0%,
                    #22548f 100%
                );

            background-size: cover;
            background-position: center;

            color: white;

            display: flex;
            justify-content: center;

            padding: 30px;
        }

        .main-container {
            width: 100%;
            max-width: 1100px;

            display: flex;
            flex-direction: column;

            gap: 25px;
        }

        .card {
            background: rgba(14, 22, 34, 0.78);

            border: 1px solid rgba(255, 255, 255, 0.11);

            border-radius: 8px;

            padding: 30px;

            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.16);
        }


        /* =========================================
           SEARCH
        ========================================= */

        .search-row {
            display: flex;
            gap: 12px;
        }

        .search-input {
            flex: 1;

            padding: 12px 14px;

            border: none;
            border-radius: 6px;

            background: rgba(255, 255, 255, 0.82);

            color: black;

            font-size: 15px;

            outline: none;
        }

        .search-input:focus {
            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.55),
                0 0 18px rgba(59, 130, 246, 0.35);
        }

        .btn {
            padding: 12px 18px;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            color: white;

            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-clear {
            background: rgba(192, 82, 96, 0.90);
        }

        .btn-clear:hover {
            background: rgba(208, 96, 110, 0.96);
        }


        /* =========================================
           SHORTCUTS GRID
        ========================================= */

        .shortcuts-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 22px;
        }


        /* =========================================
           SHORTCUT GROUP
        ========================================= */

        .shortcut-group {
            display: flex;

            gap: 5px;

            min-width: 0;
        }


        /* =========================================
           MAIN SHORTCUT BUTTON
        ========================================= */

        .shortcut {
            display: flex;
            align-items: center;

            gap: 12px;

            min-height: 48px;

            padding: 12px 14px;

            border-radius: 8px 0 0 8px;

            text-decoration: none;

            color: white;

            background: rgba(255, 255, 255, 0.11);

            border: 1px solid rgba(255, 255, 255, 0.08);

            transition: 0.2s;

            flex: 1;

            min-width: 0;
        }

        .shortcut:hover {
            background: rgba(255, 255, 255, 0.145);

            transform: translateY(-1px);
        }

        .shortcut img {
            width: 24px;
            height: 24px;

            flex-shrink: 0;

            border-radius: 4px;
        }

        .shortcut span {
            font-size: 15px;
            font-weight: 500;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================================
           SINGLE SHORTCUT
           (WITHOUT SEARCH)
        ========================================= */

        .shortcut-single {
            border-radius: 8px;
        }


        /* =========================================
           SEARCH BUTTON
        ========================================= */

        .shortcut-search {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 48px;
            min-width: 48px;

            min-height: 48px;

            padding: 0;

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 0 8px 8px 0;

            color: white;

            background: rgba(255, 255, 255, 0.11);

            cursor: pointer;

            transition: 0.2s;
        }

        .shortcut-search:hover {
            background: rgba(255, 255, 255, 0.145);

            transform: translateY(-1px);
        }


        /* =========================================
           SEARCH SYMBOL
        ========================================= */

        .shortcut-search span {
            font-family: Arial, sans-serif;

            font-size: 30px;

            line-height: 1;

            display: block;

            transform: translateY(-2px);
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1000px) {

            .shortcuts-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            .card {
                padding: 25px;
            }

            .search-row {
                flex-wrap: wrap;
            }

            .search-input {
                width: 100%;

                flex: unset;
            }

            .btn-clear {
                flex: 1;
            }

            .shortcuts-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <div class="main-container">


        <!-- =========================================
             SEARCH
        ========================================= -->

        <div class="card">

            <div class="search-row">

                <input
                    class="search-input"
                    type="text"
                    id="searchInput"
                    placeholder="Type here what you want to search."
                    onkeydown="handleKey(event)"
                    autofocus
                >

                <button
                    class="btn btn-clear"
                    onclick="clearInput()"
                >
                    Clear
                </button>

            </div>

        </div>


        <!-- =========================================
             SHORTCUTS
        ========================================= -->

        <div class="card">

            <div
                class="shortcuts-grid"
                id="shortcutsGrid"
            ></div>

        </div>


    </div>


    <script>


        // =========================================
        // SHORTCUTS
        // =========================================

        const shortcuts = [


            // -----------------------------------------
            // DUCKDUCKGO
            // -----------------------------------------

            {
                name: 'DuckDuckGo',
                url: 'https://duckduckgo.com/',
                search: 'duck'
            },

            {
                name: 'DDG Img',
                url: 'https://duckduckgo.com/',
                search: 'duckImages'
            },


            // -----------------------------------------
            // GOOGLE
            // -----------------------------------------

            {
                name: 'Google BR',
                url: 'https://www.google.com.br/',
                search: 'googleBR'
            },

            {
                name: 'Google BR Img',
                url: 'https://www.google.com.br/',
                search: 'googleImagesBR'
            },

            {
                name: 'Google',
                url: 'https://www.google.com/',
                search: 'googleNCR'
            },

            {
                name: 'Google Img',
                url: 'https://www.google.com/',
                search: 'googleImagesNCR'
            },


            // -----------------------------------------
            // OTHER SITES
            // -----------------------------------------

            {
                name: 'Instagram',
                url: 'https://www.instagram.com/',
                search: 'instagram'
            },

            {
                name: 'Inoreader',
                url: 'https://www.inoreader.com/all_articles',
                search: null
            },

            {
                name: 'YouTube',
                url: 'https://youtube.com',
                search: 'youtube'
            },

            {
                name: 'Google Translate',
                url: 'https://translate.google.com/?sl=auto&tl=pt&op=translate',
                search: 'translate'
            },

            {
                name: 'ChatGPT',
                url: 'https://chatgpt.com/',
                search: 'chatgpt'
            },

            {
                name: 'Perplexity',
                url: 'https://www.perplexity.ai/',
                search: 'perplexity'
            },

            {
                name: 'JustWatch',
                url: 'https://www.justwatch.com/br',
                search: 'justwatch'
            },

            {
                name: 'GitHub',
                url: 'https://github.com/',
                search: 'github'
            },


            // -----------------------------------------
            // EXAMPLE WITHOUT SEARCH
            // -----------------------------------------

            {
                name: 'Netflix',
                url: 'https://www.netflix.com/',
                search: null
            }

        ];


        // =========================================
        // FAVICONS
        // =========================================

        function getDomain(url) {

            return new URL(url).hostname;

        }


        function getOrigin(url) {

            return new URL(url).origin;

        }


        function getFaviconSources(shortcut) {

            const domain =
                getDomain(shortcut.url);

            const origin =
                getOrigin(shortcut.url);

            return [

                // DuckDuckGo
                `https://icons.duckduckgo.com/ip3/${domain}.ico`,

                // Google
                `https://www.google.com/s2/favicons?domain=${domain}&sz=64`,

                // favicon.ico tradicional
                `${origin}/favicon.ico`

            ];

        }


        // =========================================
        // CREATE SHORTCUT
        // =========================================

        function createShortcut(shortcutData) {

            /*
             * Quando search for null:
             *
             *     [ Netflix                 ]
             *
             * Quando existir search:
             *
             *     [ Google              ] [ ⌕ ]
             */


            // -----------------------------------------
            // SHORTCUT WITHOUT SEARCH
            // -----------------------------------------

            if (!shortcutData.search) {

                const a =
                    document.createElement('a');

                a.className =
                    'shortcut shortcut-single';

                a.href =
                    shortcutData.url;


                addShortcutContent(
                    a,
                    shortcutData
                );


                return a;

            }


            // -----------------------------------------
            // SHORTCUT WITH SEARCH
            // -----------------------------------------

            const group =
                document.createElement('div');

            group.className =
                'shortcut-group';


            // -----------------------------------------
            // SITE BUTTON
            // -----------------------------------------

            const a =
                document.createElement('a');

            a.className =
                'shortcut';

            a.href =
                shortcutData.url;


            addShortcutContent(
                a,
                shortcutData
            );


            // -----------------------------------------
            // SEARCH BUTTON
            // -----------------------------------------

            const searchButton =
                document.createElement('button');

            searchButton.className =
                'shortcut-search';

            searchButton.type =
                'button';

            searchButton.title =
                `Pesquisar no ${shortcutData.name}`;


            const searchIcon =
                document.createElement('span');

            searchIcon.textContent =
                '⌕';


            searchButton.appendChild(
                searchIcon
            );


            searchButton.onclick = () => {

                searchShortcut(
                    shortcutData.search
                );

            };


            group.appendChild(a);

            group.appendChild(
                searchButton
            );


            return group;

        }


        // =========================================
        // ADD SHORTCUT CONTENT
        // =========================================

        function addShortcutContent(
            element,
            shortcutData
        ) {

            const img =
                document.createElement('img');


            const faviconSources =
                getFaviconSources(shortcutData);


            let current = 0;


            img.src =
                faviconSources[current];


            img.onerror = () => {

                current++;

                if (
                    current <
                    faviconSources.length
                ) {

                    img.src =
                        faviconSources[current];

                }

            };


            const span =
                document.createElement('span');

            span.textContent =
                shortcutData.name;


            element.appendChild(img);

            element.appendChild(span);

        }


        // =========================================
        // RENDER SHORTCUTS
        // =========================================

        function renderShortcuts() {

            const grid =
                document.getElementById(
                    'shortcutsGrid'
                );


            shortcuts.forEach(shortcut => {

                grid.appendChild(
                    createShortcut(shortcut)
                );

            });

        }


        renderShortcuts();


        // =========================================
        // GET SEARCH QUERY
        // =========================================

        function getSearchQuery() {

            return document
                .getElementById('searchInput')
                .value
                .trim();

        }


        // =========================================
        // SEARCH SHORTCUT
        // =========================================

        function searchShortcut(type) {

            const query =
                getSearchQuery();


            if (!query)
                return;


            let url;


            // -----------------------------------------
            // DUCKDUCKGO
            // -----------------------------------------

            if (type === 'duck') {

                url =
                    `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;

            }


            else if (type === 'duckImages') {

                url =
                    `https://duckduckgo.com/?q=${encodeURIComponent(query)}&iax=images&ia=images`;

            }


            // -----------------------------------------
            // GOOGLE BR
            // -----------------------------------------

            else if (type === 'googleBR') {

                url =
                    `https://www.google.com.br/search?udm=14&q=${encodeURIComponent(query)}`;

            }


            else if (type === 'googleImagesBR') {

                url =
                    `https://www.google.com.br/search?tbm=isch&q=${encodeURIComponent(query)}`;

            }


            // -----------------------------------------
            // GOOGLE NCR
            // -----------------------------------------

            else if (type === 'googleNCR') {

                url =
                    `https://www.google.com/search?pws=0&gl=001&udm=14&q=${encodeURIComponent(query)}`;

            }


            else if (type === 'googleImagesNCR') {

                url =
                    `https://www.google.com/search?pws=0&gl=001&tbm=isch&q=${encodeURIComponent(query)}`;

            }


            // -----------------------------------------
            // INSTAGRAM
            // -----------------------------------------

            else if (type === 'instagram') {

                url =
                    `https://www.google.com/search?q=site%3Ainstagram.com+${encodeURIComponent(query)}`;

            }


            // -----------------------------------------
            // INOREADER
            // -----------------------------------------

            else if (type === 'inoreader') {

                url =
                    `https://www.google.com/search?q=site%3Ainoreader.com+${encodeURIComponent(query)}`;

            }


            // -----------------------------------------
            // YOUTUBE
            // -----------------------------------------

            else if (type === 'youtube') {

                url =
                    `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;

            }


            // -----------------------------------------
            // GOOGLE TRANSLATE
            // -----------------------------------------

            else if (type === 'translate') {

                url =
                    `https://translate.google.com/?sl=auto&tl=pt&text=${encodeURIComponent(query)}&op=translate`;

            }


            // -----------------------------------------
            // CHATGPT
            // -----------------------------------------

            else if (type === 'chatgpt') {

                url =
                    `https://chatgpt.com/?q=${encodeURIComponent(query)}`;

            }


            // -----------------------------------------
            // PERPLEXITY
            // -----------------------------------------

            else if (type === 'perplexity') {

                url =
                    `https://www.perplexity.ai/search?q=${encodeURIComponent(query)}`;

            }


            // -----------------------------------------
            // JUSTWATCH
            // -----------------------------------------

            else if (type === 'justwatch') {

                url =
                    `https://br.justwatch.com/br/busca?q=${encodeURIComponent(query)}`;

            }


            // -----------------------------------------
            // GITHUB
            // -----------------------------------------

            else if (type === 'github') {

                url =
                    `https://github.com/search?q=${encodeURIComponent(query)}&type=repositories`;

            }


            if (url) {

                window.location.href =
                    url;

            }

        }


        // =========================================
        // CLEAR
        // =========================================

        function clearInput() {

            const input =
                document.getElementById(
                    'searchInput'
                );


            input.value = '';

            input.focus();

        }


        // =========================================
        // KEYBOARD
        // =========================================

        function handleKey(event) {

            if (event.key === 'Enter') {

                searchShortcut('duck');

            }


            if (event.key === 'Escape') {

                clearInput();

            }

        }

    </script>

</body>

</html>
